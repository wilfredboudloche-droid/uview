<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Banner - Computer Tech Literacy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050a14;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .banner-wrapper {
            position: relative;
            width: 95vw;
            max-width: 1200px;
            aspect-ratio: 2 / 1;
            background-image: url('Tech News Banner with Video Placeholder.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 0 40px rgba(0, 162, 255, 0.2);
        }

        /* Portrait-style video box matching the blue glowing square */
        .video-box {
            position: absolute;
            top: 22.5%;
            right: 12.2%;
            width: 22.2%;
            height: 53%;
            background-color: #000;
            border-radius: 2px;
            overflow: hidden;
        }

        /* Scale the iframe larger than the box, then center it
           This crops the sides slightly to eliminate black bars */
        .video-box iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            /* 9:16 ratio — height drives the size, width is calculated */
            height: 100%;
            width: calc(100% * 9 / 16 * (16/9));
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            border: none;
        }

        @media (max-width: 600px) {
            .banner-wrapper {
                width: 100vw;
            }
        }
    </style>
</head>
<body>

    <div class="banner-wrapper">
        <div class="video-box">
            <iframe width="472" height="839" src="https://www.youtube.com/embed/C2kpro7w1T8" title="Notebook LM Test" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
