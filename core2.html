<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UVA Core 2 Mission Hub — Virtue, Vigor, Vision</title>
<style>
/* ─── CSS Reset & Variables ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --uva-blue:#1B5EAF;--uva-green:#1E7A3E;--uva-gold:#D4A843;
  --uva-dark:#0F3460;--uva-light:#E8F0FE;--uva-bg:#F4F7FB;
  --uva-red:#C0392B;--uva-orange:#E67E22;--uva-purple:#8E44AD;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.1);
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--uva-bg);color:#1a1a2e;line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-weight:700}
button{cursor:pointer;border:none;font-family:inherit;font-size:1rem;border-radius:var(--radius);padding:.65rem 1.4rem;transition:all .2s}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}
input{font-family:inherit;font-size:1rem;padding:.65rem 1rem;border:2px solid #ccc;border-radius:var(--radius);outline:none;transition:border .2s}
input:focus{border-color:var(--uva-blue)}

/* ─── Confetti Canvas ─── */
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}

/* ─── Screens ─── */
.screen{display:none;animation:fadeIn .4s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ─── Login Screen ─── */
#login-screen.active{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--uva-dark) 0%,var(--uva-blue) 50%,var(--uva-green) 100%)}
.login-card{background:#fff;border-radius:20px;padding:3rem 2.5rem;max-width:440px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-card .logo{font-size:3rem;margin-bottom:.3rem}
.login-card h1{color:var(--uva-blue);font-size:1.6rem;margin-bottom:.2rem}
.login-card .motto{color:var(--uva-green);font-style:italic;margin-bottom:1.5rem;font-size:.95rem}
.login-card input{width:100%;margin-bottom:1rem}
.login-card .btn-primary{width:100%;background:var(--uva-blue);color:#fff;font-size:1.1rem;padding:.8rem}
.login-card .btn-secondary{width:100%;background:var(--uva-green);color:#fff;margin-top:.5rem;font-size:.95rem}
.login-card .btn-link{background:none;color:var(--uva-blue);text-decoration:underline;font-size:.85rem;margin-top:.8rem;padding:.3rem}
.login-card .btn-leaderboard{width:100%;background:var(--uva-gold);color:#fff;margin-top:.5rem;font-size:.95rem}
.login-error{color:var(--uva-red);font-size:.85rem;min-height:1.2rem;margin-bottom:.5rem}

/* ─── Header ─── */
.app-header{background:linear-gradient(135deg,var(--uva-dark),var(--uva-blue));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.app-header .brand{display:flex;align-items:center;gap:.7rem}
.app-header .brand .logo{font-size:1.8rem}
.app-header .brand h2{font-size:1.15rem}
.app-header .user-info{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.app-header .user-info span{font-size:.9rem;opacity:.9}
.header-btn{background:rgba(255,255,255,.15);color:#fff;font-size:.8rem;padding:.45rem .9rem}
.header-btn:hover{background:rgba(255,255,255,.3)}

/* ─── Stats Bar ─── */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;padding:1rem 1.5rem;background:#fff;border-bottom:2px solid var(--uva-light)}
.stat-card{text-align:center;padding:.6rem;border-radius:var(--radius);background:var(--uva-light)}
.stat-card .stat-value{font-size:1.4rem;font-weight:800;color:var(--uva-blue)}
.stat-card .stat-label{font-size:.7rem;color:#666;text-transform:uppercase;letter-spacing:.5px}

/* ─── Main Content ─── */
.main-content{max-width:1200px;margin:0 auto;padding:1.5rem}

/* ─── Domain Section ─── */
.domain-section{margin-bottom:2rem}
.domain-header{display:flex;align-items:center;gap:.7rem;padding:.8rem 1.2rem;border-radius:var(--radius) var(--radius) 0 0;color:#fff;font-size:1.05rem}
.domain-header .domain-icon{font-size:1.4rem}
.domain-header .domain-progress{margin-left:auto;font-size:.85rem;opacity:.9}
.domain-1 .domain-header{background:linear-gradient(135deg,#1B5EAF,#2980B9)}
.domain-2 .domain-header{background:linear-gradient(135deg,#1E7A3E,#27AE60)}
.domain-3 .domain-header{background:linear-gradient(135deg,#E67E22,#F39C12)}
.domain-4 .domain-header{background:linear-gradient(135deg,#8E44AD,#9B59B6)}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.8rem;padding:1rem;background:#fff;border-radius:0 0 var(--radius) var(--radius);border:1px solid #e0e0e0;border-top:none}

/* ─── Module Card ─── */
.module-card{border:2px solid #e0e0e0;border-radius:var(--radius);padding:1rem;transition:all .2s;position:relative;overflow:hidden}
.module-card:hover{border-color:var(--uva-blue);box-shadow:var(--shadow)}
.module-card.completed{border-color:var(--uva-green);background:#f0faf0}
.module-card.completed::after{content:'✅';position:absolute;top:.5rem;right:.5rem;font-size:1.2rem}
.module-card .module-id{font-size:.7rem;color:#999;text-transform:uppercase;letter-spacing:.5px}
.module-card .module-title{font-size:.9rem;font-weight:600;margin:.3rem 0}
.module-card .module-score{font-size:.8rem;color:var(--uva-green);font-weight:600}
.module-card .btn-start{width:100%;margin-top:.6rem;background:var(--uva-blue);color:#fff;font-size:.85rem;padding:.5rem}
.module-card.completed .btn-start{background:var(--uva-green)}

/* ─── Quiz Screen ─── */
.quiz-container{max-width:750px;margin:0 auto;padding:1.5rem}
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
.quiz-header h3{color:var(--uva-blue);font-size:1.1rem}
.quiz-progress-bar{width:100%;height:8px;background:#e0e0e0;border-radius:4px;margin:1rem 0}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--uva-blue),var(--uva-green));border-radius:4px;transition:width .4s}
.question-card{background:#fff;border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);margin-bottom:1.5rem}
.question-card .q-number{font-size:.8rem;color:var(--uva-blue);font-weight:600;margin-bottom:.5rem}
.question-card .q-text{font-size:1.05rem;font-weight:600;margin-bottom:1.2rem;line-height:1.5}
.answer-option{display:block;width:100%;text-align:left;padding:.8rem 1rem;margin-bottom:.5rem;border:2px solid #e0e0e0;border-radius:var(--radius);background:#fafafa;font-size:.95rem;transition:all .2s}
.answer-option:hover{border-color:var(--uva-blue);background:var(--uva-light)}
.answer-option.selected{border-color:var(--uva-blue);background:var(--uva-light);font-weight:600}
.answer-option.correct{border-color:var(--uva-green);background:#e8f8e8;color:var(--uva-green)}
.answer-option.incorrect{border-color:var(--uva-red);background:#fde8e8;color:var(--uva-red)}
.answer-option:disabled{cursor:default;transform:none;filter:none}
.explanation-box{background:#FFF9E6;border-left:4px solid var(--uva-gold);padding:1rem;border-radius:0 var(--radius) var(--radius) 0;margin-top:1rem;font-size:.9rem;display:none}
.explanation-box.show{display:block}
.quiz-nav{display:flex;gap:1rem;justify-content:center;margin-top:1rem}
.quiz-nav button{padding:.7rem 2rem}
.btn-next{background:var(--uva-blue);color:#fff}
.btn-finish{background:var(--uva-green);color:#fff}
.btn-back{background:#95a5a6;color:#fff}

/* ─── Results Screen ─── */
.results-container{max-width:600px;margin:0 auto;text-align:center;padding:2rem}
.results-container .result-icon{font-size:4rem;margin-bottom:.5rem}
.results-container h2{color:var(--uva-blue);margin-bottom:.3rem}
.results-container .score-big{font-size:3rem;font-weight:800;color:var(--uva-green);margin:.5rem 0}
.results-container .score-big.fail{color:var(--uva-red)}
.badge-earned{display:inline-block;background:linear-gradient(135deg,var(--uva-gold),#F1C40F);color:#fff;padding:.5rem 1.2rem;border-radius:20px;font-weight:700;margin:.5rem;font-size:.9rem}
.results-actions{display:flex;gap:1rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}

/* ─── Teacher Dashboard ─── */
.dashboard-container{max-width:1000px;margin:0 auto;padding:1.5rem}
.dashboard-container h2{color:var(--uva-blue);margin-bottom:1rem}
.dashboard-tabs{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.dashboard-tabs button{background:#e0e0e0;color:#333;padding:.5rem 1.2rem}
.dashboard-tabs button.active{background:var(--uva-blue);color:#fff}
.student-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.student-table th{background:var(--uva-blue);color:#fff;padding:.7rem;text-align:left;font-size:.85rem}
.student-table td{padding:.6rem .7rem;border-bottom:1px solid #eee;font-size:.85rem}
.student-table tr:hover{background:var(--uva-light)}
.student-table .btn-sm{font-size:.75rem;padding:.3rem .7rem}
.btn-danger{background:var(--uva-red);color:#fff}
.btn-info{background:var(--uva-blue);color:#fff}
.student-detail-card{background:#fff;border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);margin-top:1rem}
.progress-ring{display:inline-block;width:80px;height:80px}

/* ─── Leaderboard ─── */
.leaderboard-container{max-width:700px;margin:0 auto;padding:1.5rem}
.leaderboard-container h2{color:var(--uva-blue);text-align:center;margin-bottom:1rem}
.lb-podium{display:flex;justify-content:center;align-items:flex-end;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.lb-podium .podium-item{text-align:center;padding:1rem;border-radius:var(--radius);color:#fff;min-width:100px}
.podium-1{background:linear-gradient(135deg,#F1C40F,#D4A843);order:2;padding-bottom:2rem!important}
.podium-2{background:linear-gradient(135deg,#BDC3C7,#95A5A6);order:1;padding-bottom:1.2rem!important}
.podium-3{background:linear-gradient(135deg,#E67E22,#D35400);order:3;padding-bottom:1rem!important}
.podium-item .place{font-size:1.8rem;font-weight:800}
.podium-item .name{font-size:.85rem;font-weight:600;margin-top:.3rem}
.podium-item .pts{font-size:.75rem;opacity:.9}
.lb-list{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.lb-row{display:flex;align-items:center;padding:.7rem 1rem;border-bottom:1px solid #eee;gap:.8rem}
.lb-row:hover{background:var(--uva-light)}
.lb-rank{font-weight:800;color:var(--uva-blue);min-width:30px;text-align:center}
.lb-name{flex:1;font-weight:600}
.lb-score{color:var(--uva-green);font-weight:700}
.lb-pct{color:#666;font-size:.85rem;min-width:50px;text-align:right}

/* ─── Badges Display ─── */
.badges-section{margin-top:1.5rem}
.badges-grid{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:.5rem}
.badge-item{text-align:center;padding:.6rem;border-radius:var(--radius);background:#fff;border:2px solid #e0e0e0;min-width:80px}
.badge-item.earned{border-color:var(--uva-gold);background:#FFF9E6}
.badge-item .badge-icon{font-size:1.8rem}
.badge-item .badge-name{font-size:.65rem;color:#666;margin-top:.2rem}

/* ─── Streak Display ─── */
.streak-display{display:flex;align-items:center;gap:.4rem;font-size:.85rem}
.streak-display .fire{font-size:1.1rem}

/* ─── Rank Badge ─── */
.rank-badge{display:inline-flex;align-items:center;gap:.3rem;background:linear-gradient(135deg,var(--uva-gold),#F1C40F);color:#fff;padding:.25rem .7rem;border-radius:15px;font-size:.8rem;font-weight:700}

/* ─── Multi-select hint ─── */
.multi-hint{font-size:.8rem;color:var(--uva-orange);font-style:italic;margin-bottom:.5rem}

/* ─── Responsive ─── */
@media(max-width:600px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .modules-grid{grid-template-columns:1fr}
  .app-header{flex-direction:column;text-align:center}
  .quiz-container,.results-container,.dashboard-container,.leaderboard-container{padding:1rem}
}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<!-- ═══════ LOGIN SCREEN ═══════ -->
<div id="login-screen" class="screen active">
  <div class="login-card">
    <div class="logo">🎓</div>
    <h1>UVA Core 2 Mission Hub</h1>
    <p class="motto">"Virtue, Vigor, Vision"</p>
    <div id="login-mode-new">
      <p style="font-size:.9rem;color:#555;margin-bottom:1rem">Enter your name to begin your mission</p>
      <input type="text" id="input-name" placeholder="First Name + Last Initial (e.g. Jake M)" maxlength="25" autocomplete="off">
      <div class="login-error" id="login-error"></div>
      <button class="btn-primary" onclick="loginStudent()">🚀 Launch Mission</button>
      <button class="btn-secondary" onclick="showResumeMode()">🔄 Resume My Progress</button>
      <button class="btn-leaderboard" onclick="showLeaderboard()">🏆 Leaderboard</button>
      <button class="btn-link" onclick="showTeacherLogin()">🔑 Teacher Dashboard</button>
    </div>
    <div id="login-mode-resume" style="display:none">
      <p style="font-size:.9rem;color:#555;margin-bottom:1rem">Enter your name to resume</p>
      <input type="text" id="input-resume-name" placeholder="Your name (e.g. Jake M)" maxlength="25" autocomplete="off">
      <div class="login-error" id="resume-error"></div>
      <button class="btn-secondary" onclick="resumeStudent()">🔄 Resume</button>
      <button class="btn-link" onclick="showNewMode()">← Back to Login</button>
    </div>
    <div id="login-mode-teacher" style="display:none">
      <p style="font-size:.9rem;color:#555;margin-bottom:1rem">Enter Teacher PIN</p>
      <input type="password" id="input-pin" placeholder="Enter PIN" maxlength="10" autocomplete="off">
      <div class="login-error" id="pin-error"></div>
      <button class="btn-primary" style="background:var(--uva-purple)" onclick="loginTeacher()">🔑 Access Dashboard</button>
      <button class="btn-link" onclick="showNewMode()">← Back to Login</button>
    </div>
  </div>
</div>

<!-- ═══════ MAIN HUB SCREEN ═══════ -->
<div id="hub-screen" class="screen">
  <div class="app-header">
    <div class="brand">
      <span class="logo">🎓</span>
      <div><h2>UVA Core 2 Mission Hub</h2><small style="opacity:.7">Virtue, Vigor, Vision</small></div>
    </div>
    <div class="user-info">
      <span id="header-rank" class="rank-badge"></span>
      <span id="header-streak" class="streak-display"></span>
      <span id="header-name"></span>
      <button class="header-btn" onclick="showLeaderboard()">🏆 Board</button>
      <button class="header-btn" onclick="logout()">🚪 Logout</button>
    </div>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="main-content">
    <div id="badges-display" class="badges-section" style="margin-bottom:1.5rem"></div>
    <div id="domains-container"></div>
  </div>
</div>

<!-- ═══════ QUIZ SCREEN ═══════ -->
<div id="quiz-screen" class="screen">
  <div class="app-header">
    <div class="brand"><span class="logo">📝</span><h2 id="quiz-title">Module Quiz</h2></div>
    <button class="header-btn" onclick="exitQuiz()">✕ Exit</button>
  </div>
  <div class="quiz-container" id="quiz-container"></div>
</div>

<!-- ═══════ RESULTS SCREEN ═══════ -->
<div id="results-screen" class="screen">
  <div class="app-header">
    <div class="brand"><span class="logo">🏆</span><h2>Mission Results</h2></div>
  </div>
  <div class="results-container" id="results-container"></div>
</div>

<!-- ═══════ TEACHER DASHBOARD ═══════ -->
<div id="teacher-screen" class="screen">
  <div class="app-header" style="background:linear-gradient(135deg,#4A0E4E,var(--uva-purple))">
    <div class="brand"><span class="logo">👩‍🏫</span><h2>Teacher Dashboard</h2></div>
    <div class="user-info">
      <button class="header-btn" onclick="showLoginScreen()">🚪 Exit</button>
    </div>
  </div>
  <div class="dashboard-container" id="dashboard-container"></div>
</div>

<!-- ═══════ LEADERBOARD SCREEN ═══════ -->
<div id="leaderboard-screen" class="screen">
  <div class="app-header" style="background:linear-gradient(135deg,#B7950B,var(--uva-gold))">
    <div class="brand"><span class="logo">🏆</span><h2>Mission Leaderboard</h2></div>
    <button class="header-btn" onclick="exitLeaderboard()">← Back</button>
  </div>
  <div class="leaderboard-container" id="leaderboard-container"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   DATA: 22 Modules across 4 Domains — CompTIA A+ Core 2 (220-1202)
   ══════════════════════════════════════════════════════════════ */
const DOMAINS = [
  {id:1,name:"Operating Systems",icon:"💻",color:"#1B5EAF"},
  {id:2,name:"Security",icon:"🔒",color:"#1E7A3E"},
  {id:3,name:"Software Troubleshooting",icon:"🔧",color:"#E67E22"},
  {id:4,name:"Operational Procedures",icon:"📋",color:"#8E44AD"}
];

const MODULES = [
  // ── Domain 1: Operating Systems (Modules 1–8) ──
  {id:"m1",domain:1,title:"Windows Command Line Tools",questions:[
    {q:"A server administrator sets up jobs to copy files on various servers. They want to detect if the file was transferred successfully and, if not, resend the file. Which command is optimal?",opts:["copy","xcopy","robocopy","move"],ans:[2],exp:"Robocopy (robust copy) detects transfer failures and can retry. Microsoft recommends it over xcopy for long file names and NTFS attributes."},
    {q:"A penetration tester connects to an executive's computer. What command tells them the location of where their shell landed?",opts:["pwd","mv","cp","ls"],ans:[0],exp:"pwd 'prints' the working directory, showing the current location in the filesystem."},
    {q:"Which command is used to display the contents of a directory in Linux?",opts:["dir","pwd","ls","cat"],ans:[2],exp:"ls lists directory contents. The -l flag shows detailed information and -a shows hidden files."},
    {q:"Which Windows command displays the IP configuration of all network adapters?",opts:["netstat","ipconfig /all","ping","tracert"],ans:[1],exp:"ipconfig /all displays full TCP/IP configuration for all adapters including MAC address, DHCP, and DNS settings."},
    {q:"A technician needs to verify DNS resolution. Which command should they use?",opts:["ping","nslookup","netstat","tracert"],ans:[1],exp:"nslookup queries DNS servers to find IP addresses associated with domain names or vice versa."}
  ]},
  {id:"m2",domain:1,title:"Windows Control Panel & Settings",questions:[
    {q:"A healthcare provider sets up color-filter modes for users who are color blind. Where can this be configured?",opts:["Accessibility","Show hidden files","Mail","Windows Firewall"],ans:[0],exp:"Ease of Access / Accessibility settings configure input and output options. In Windows 11, it's under the Accessibility heading."},
    {q:"An IT manager wants to enable a data at rest solution. Where can the manager enable the built-in Microsoft solution?",opts:["Network and Sharing","Devices and Printers","System Settings","Programs and Features"],ans:[2],exp:"System Settings presents options for BitLocker disk encryption, power, remote desktop, and clipboard."},
    {q:"A computer administrator sets up a client workstation to join a centrally managed network. What options should the administrator configure?",opts:["HomeGroup settings","Domain settings","Workgroup name only","VPN connection"],ans:[1],exp:"To join a centrally managed (Active Directory) network, the workstation must be configured with domain settings."},
    {q:"Where would you configure default programs for file types in Windows 10?",opts:["Control Panel > System","Settings > Apps > Default apps","Task Manager","Device Manager"],ans:[1],exp:"Settings > Apps > Default apps allows you to set which programs open specific file types and protocols."},
    {q:"Which Control Panel applet manages installed programs and Windows Features?",opts:["System","Programs and Features","Device Manager","Administrative Tools"],ans:[1],exp:"Programs and Features is the legacy software management interface for installing and modifying desktop applications."}
  ]},
  {id:"m3",domain:1,title:"Windows Networking & Sharing",questions:[
    {q:"Which tool shows active network connections and listening ports on a Windows computer?",opts:["ipconfig","nslookup","netstat","pathping"],ans:[2],exp:"netstat displays active TCP connections, ports on which the computer is listening, and network statistics."},
    {q:"A user needs to map a network drive. Which path format should they use?",opts:["http://server/share","//server/share","\\\\server\\share","ftp://server/share"],ans:[2],exp:"UNC (Universal Naming Convention) paths use \\\\server\\share format for Windows network resources."},
    {q:"What Windows feature allows you to share files with other computers on your local network?",opts:["Remote Desktop","File and Printer Sharing","BitLocker","Windows Update"],ans:[1],exp:"File and Printer Sharing must be enabled in Network and Sharing Center to share resources on a local network."},
    {q:"Which service translates computer names to IP addresses on a local network?",opts:["DHCP","DNS","WINS","NAT"],ans:[1],exp:"DNS (Domain Name System) resolves hostnames to IP addresses. On local networks, it works with Active Directory."},
    {q:"A technician needs to test network connectivity to a remote server. Which command should they use first?",opts:["tracert","netstat","ping","nslookup"],ans:[2],exp:"ping is the basic tool to test if a remote host is reachable by sending ICMP echo requests."}
  ]},
  {id:"m4",domain:1,title:"macOS & Linux Basics",questions:[
    {q:"Which package manager is commonly used on Debian-based Linux distributions?",opts:["yum","brew","apt-get","pacman"],ans:[2],exp:"apt-get is the package manager for Debian-based distributions like Ubuntu. It handles installing, updating, and removing software."},
    {q:"What is the macOS equivalent of Windows Task Manager?",opts:["Terminal","Activity Monitor","Finder","System Preferences"],ans:[1],exp:"Activity Monitor shows running processes, CPU usage, memory, energy, disk, and network activity on macOS."},
    {q:"Which Linux command changes file permissions?",opts:["chown","chmod","chgrp","ls -l"],ans:[1],exp:"chmod changes the file mode (permissions) bits. It controls read, write, and execute permissions for owner, group, and others."},
    {q:"In macOS, where do you manage startup applications?",opts:["Activity Monitor","System Preferences > Users & Groups > Login Items","Terminal","Finder"],ans:[1],exp:"Login Items in Users & Groups lets you add or remove applications that launch automatically when you log in."},
    {q:"What does the Linux command 'sudo' do?",opts:["Switches user accounts","Runs a command as superuser","Shuts down the system","Lists running processes"],ans:[1],exp:"sudo (superuser do) executes a command with elevated/root privileges, requiring the user's password for authentication."}
  ]},
  {id:"m5",domain:1,title:"Windows Installation & Upgrades",questions:[

let currentStudent = null;
let currentQuiz = null;
let returnToScreen = 'login';

function getAllData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {students:{}}; }
  catch(e) { return {students:{}}; }
}
function saveAllData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function getStudentData(name) {
  const data = getAllData();
  return data.students[name.toLowerCase()] || null;
}

function saveStudentData(name, studentData) {
  const data = getAllData();
  data.students[name.toLowerCase()] = studentData;
  saveAllData(data);
}

function createNewStudent(name) {
  return {
    name: name,
    createdAt: new Date().toISOString(),
    lastActive: new Date().toISOString(),
    totalScore: 0,
    modulesCompleted: {},
    badges: [],
    streak: { count: 0, lastDate: null },
    quizHistory: []
  };
}

function getRank(score) {
  let rank = RANKS[0];
  for (const r of RANKS) { if (score >= r.minScore) rank = r; }
  return rank;
}

function getCompletionPct(student) {
  return Math.round((Object.keys(student.modulesCompleted).length / MODULES.length) * 100);
}

function validateName(name) {
  const trimmed = name.trim();
  if (!trimmed || trimmed.length < 2) return null;
  return trimmed.replace(/\s+/g, ' ');
}

function loginStudent() {
  const raw = document.getElementById('input-name').value;
  const name = validateName(raw);
  if (!name) { document.getElementById('login-error').textContent = 'Please enter your first name + last initial (e.g. Jake M)'; return; }
  const existing = getStudentData(name);
  if (existing) {
    currentStudent = existing;
    updateStreak(currentStudent);
    currentStudent.lastActive = new Date().toISOString();
    saveStudentData(name, currentStudent);
  } else {
    currentStudent = createNewStudent(name);
    saveStudentData(name, currentStudent);
  }
  returnToScreen = 'hub';
  showScreen('hub-screen');
  renderHub();
}

/* ══════════════════════════════════════════════════════════════
   STREAK
   ══════════════════════════════════════════════════════════════ */
function updateStreak(student) {
  const today = new Date().toISOString().slice(0, 10);
  if (!student.streak.lastDate) { student.streak = { count: 1, lastDate: today }; return; }
  if (student.streak.lastDate === today) return;
  const last = new Date(student.streak.lastDate);
  const now = new Date(today);
  const diff = Math.floor((now - last) / 86400000);
  if (diff === 1) { student.streak.count++; student.streak.lastDate = today; }
  else if (diff > 1) { student.streak = { count: 1, lastDate: today }; }
}

/* ══════════════════════════════════════════════════════════════
   QUIZ ENGINE
   ══════════════════════════════════════════════════════════════ */
function startQuiz(moduleId) {
  const mod = MODULES.find(m => m.id === moduleId);
  if (!mod) return;
  currentQuiz = {
    module: mod,
    currentQ: 0,
    answers: new Array(mod.questions.length).fill(null),
    answered: new Array(mod.questions.length).fill(false)
  };
  document.getElementById('quiz-title').textContent = mod.title;
  showScreen('quiz-screen');
  renderQuestion();
}

function renderQuestion() {
  const q = currentQuiz;
  const question = q.module.questions[q.currentQ];
  const isMulti = question.multi;
  const pct = ((q.currentQ + 1) / q.module.questions.length) * 100;

  let html = `
    <div class="quiz-header">
      <h3>${q.module.title}</h3>
      <span>Question ${q.currentQ+1} of ${q.module.questions.length}</span>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    <div class="question-card">
      <div class="q-number">Question ${q.currentQ+1}</div>
      ${isMulti ? '<div class="multi-hint">⚠️ Select all that apply (multiple correct answers)</div>' : ''}
      <div class="q-text">${question.q}</div>`;

  const answered = q.answered[q.currentQ];
  const userAns = q.answers[q.currentQ];

  for (let i = 0; i < question.opts.length; i++) {
    let cls = 'answer-option';
    let disabled = '';
    if (answered) {
      disabled = 'disabled';
      if (question.ans.includes(i)) cls += ' correct';
      else if (isMulti ? (userAns && userAns.includes(i)) : userAns === i) cls += ' incorrect';
    } else {
      if (isMulti && userAns && userAns.includes(i)) cls += ' selected';
      else if (!isMulti && userAns === i) cls += ' selected';
    }
    html += `<button class="${cls}" ${disabled} onclick="selectAnswer(${i})">${question.opts[i]}</button>`;
  }

  if (!answered) {
    html += `<div style="text-align:center;margin-top:1rem">
      <button class="btn-next" onclick="submitAnswer()">Submit Answer</button>
    </div>`;
  }

  html += `<div class="explanation-box ${answered?'show':''}">
    <strong>${answered && isCorrectAnswer(q.currentQ) ? '✅ Correct!' : answered ? '❌ Incorrect' : ''}</strong><br>
    ${question.exp}
  </div>`;
  html += '</div>';

  // Navigation
  html += '<div class="quiz-nav">';
  if (q.currentQ > 0) html += '<button class="btn-back" onclick="prevQuestion()">← Previous</button>';
  if (answered) {
    if (q.currentQ < q.module.questions.length - 1) {
      html += '<button class="btn-next" onclick="nextQuestion()">Next →</button>';
    } else {
      html += '<button class="btn-finish" onclick="finishQuiz()">🏁 Finish</button>';
    }
  }
  html += '</div>';

  document.getElementById('quiz-container').innerHTML = html;
}

function selectAnswer(idx) {
  const q = currentQuiz;
  if (q.answered[q.currentQ]) return;
  const question = q.module.questions[q.currentQ];
  if (question.multi) {
    if (!q.answers[q.currentQ]) q.answers[q.currentQ] = [];
    const arr = q.answers[q.currentQ];
    const pos = arr.indexOf(idx);
    if (pos >= 0) arr.splice(pos, 1);
    else arr.push(idx);
  } else {
    q.answers[q.currentQ] = idx;
  }
  renderQuestion();
}

function submitAnswer() {
  const q = currentQuiz;
  const question = q.module.questions[q.currentQ];
  if (question.multi) {
    if (!q.answers[q.currentQ] || q.answers[q.currentQ].length === 0) return;
  } else {
    if (q.answers[q.currentQ] === null) return;
  }
  q.answered[q.currentQ] = true;
  renderQuestion();
}

function isCorrectAnswer(qIdx) {
  const q = currentQuiz;
  const question = q.module.questions[qIdx];
  const userAns = q.answers[qIdx];
  if (question.multi) {
    if (!userAns) return false;
    return JSON.stringify([...userAns].sort()) === JSON.stringify([...question.ans].sort());
  }
  return userAns === question.ans[0];
}

function nextQuestion() { currentQuiz.currentQ++; renderQuestion(); }
function prevQuestion() { currentQuiz.currentQ--; renderQuestion(); }

function exitQuiz() {
  currentQuiz = null;
  showScreen('hub-screen');
  renderHub();
}

function finishQuiz() {
  const q = currentQuiz;
  let correct = 0;
  for (let i = 0; i < q.module.questions.length; i++) {
    if (isCorrectAnswer(i)) correct++;
  }
  const total = q.module.questions.length;
  const scorePoints = correct * 20; // 20 points per correct answer
  const pct = Math.round((correct / total) * 100);
  const passed = pct >= 70;

  // Update student data
  const prevScore = currentStudent.modulesCompleted[q.module.id]
    ? currentStudent.modulesCompleted[q.module.id].score * 20 : 0;

  currentStudent.modulesCompleted[q.module.id] = {
    score: correct,
    total: total,
    pct: pct,
    completedAt: new Date().toISOString()
  };

  currentStudent.totalScore = currentStudent.totalScore - prevScore + scorePoints;
  currentStudent.lastActive = new Date().toISOString();

  // Check badges
  checkBadges(currentStudent, q.module, pct);

  saveStudentData(currentStudent.name, currentStudent);

  // Show results
  showScreen('results-screen');
  renderResults(correct, total, pct, passed, scorePoints);

  if (passed) fireConfetti();
}

function checkBadges(student, mod, pct) {
  const b = student.badges;
  const addBadge = (id) => { if (!b.includes(id)) b.push(id); };

  // First mission
  if (Object.keys(student.modulesCompleted).length >= 1) addBadge('first_mission');

  // Domain masters
  for (const d of DOMAINS) {
    const mods = MODULES.filter(m => m.domain === d.id);
    if (mods.every(m => student.modulesCompleted[m.id])) {
      addBadge('domain_master_' + d.id);
    }
  }

  // Perfect score
  if (pct === 100) addBadge('perfect_score');

  // Streaks
  if (student.streak.count >= 3) addBadge('streak_3');
  if (student.streak.count >= 7) addBadge('streak_7');

  // Halfway
  if (Object.keys(student.modulesCompleted).length >= 11) addBadge('half_way');

  // Completionist
  if (Object.keys(student.modulesCompleted).length >= MODULES.length) addBadge('completionist');
}

function renderResults(correct, total, pct, passed, points) {
  const rank = getRank(currentStudent.totalScore);
  const newBadges = currentStudent.badges.slice(-3); // show recent badges
  let html = `
    <div class="result-icon">${passed ? '🎉' : '📚'}</div>
    <h2>${passed ? 'Mission Complete!' : 'Keep Studying!'}</h2>
    <div class="score-big ${passed?'':'fail'}">${pct}%</div>
    <p>${correct}/${total} correct • +${points} points</p>
    <p>Total Score: <strong>${currentStudent.totalScore}</strong> • Rank: ${rank.icon} ${rank.name}</p>`;

  if (newBadges.length > 0) {
    html += '<div style="margin-top:1rem">';
    for (const bid of newBadges) {
      const badge = BADGES.find(b => b.id === bid);
      if (badge) html += `<span class="badge-earned">${badge.icon} ${badge.name}</span>`;
    }
    html += '</div>';
  }

  html += `<div class="results-actions">
    <button class="btn-next" onclick="startQuiz('${currentQuiz.module.id}')">🔄 Retry Module</button>
    <button class="btn-finish" onclick="backToHub()">🏠 Back to Hub</button>
  </div>`;

  document.getElementById('results-container').innerHTML = html;
}

function backToHub() {
  currentQuiz = null;
  showScreen('hub-screen');
  renderHub();
}

  const data = getAllData();

  saveAllData(data);
  selectedStudent = null;

function resetAllData() {
  if (!confirm('⚠️ Reset ALL student data? This cannot be undone!')) return;
  if (!confirm('Are you really sure? ALL progress will be lost!')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderDashboard();

/* ══════════════════════════════════════════════════════════════
   CONFETTI
   ══════════════════════════════════════════════════════════════ */
function fireConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];
  const colors = ['#1B5EAF','#1E7A3E','#D4A843','#E67E22','#8E44AD','#F1C40F','#E74C3C','#3498DB'];

  for (let i = 0; i < 150; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 5,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 4 + 2,
      rot: Math.random() * Math.PI * 2,
      rv: (Math.random() - 0.5) * 0.2
    });
  }

  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of pieces) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rv;
      p.vy += 0.05;
      if (p.y < canvas.height + 50) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    frame++;
    if (alive && frame < 200) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}

/* ══════════════════════════════════════════════════════════════
   KEYBOARD SUPPORT
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginNew = document.getElementById('login-mode-new');
    const loginResume = document.getElementById('login-mode-resume');
    const loginTeacher = document.getElementById('login-mode-teacher');
    if (loginNew.style.display !== 'none' && document.getElementById('login-screen').classList.contains('active')) loginStudent();
    else if (loginResume.style.display !== 'none' && document.getElementById('login-screen').classList.contains('active')) resumeStudent();
    else if (loginTeacher.style.display !== 'none' && document.getElementById('login-screen').classList.contains('active')) loginTeacher();
  }
});

/* ── Init ── */
window.addEventListener('resize', () => {
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
