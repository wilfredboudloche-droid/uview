<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>International Morse Code</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .morse-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .morse-container img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      mix-blend-mode: normal;
      filter: drop-shadow(0 0 18px rgba(180, 120, 40, 0.5));
    }
  </style>
</head>
<body>
  <div class="morse-container">
    <img src="https://wilfredboudloche-droid.github.io/uview/morse_transparent.png" alt="International Morse Code" />
  </div>
</body>
</html>
